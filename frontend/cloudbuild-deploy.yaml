steps:
  - name: 'node:20-alpine'
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']
    dir: frontend

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    entrypoint: 'python3'
    args:
      - '-c'
      - |
        import os

        def inject(filepath, replacements):
            with open(filepath, 'r') as f:
                content = f.read()
            for k, v in replacements.items():
                content = content.replace(k, v)
            with open(filepath, 'w') as f:
                f.write(content)

        env_replacements = {
            'FIREBASE_API_KEY_PLACEHOLDER': os.environ['FIREBASE_API_KEY'],
            'FIREBASE_AUTH_DOMAIN_PLACEHOLDER': os.environ['FIREBASE_AUTH_DOMAIN'],
            'FIREBASE_PROJECT_ID_PLACEHOLDER': os.environ['FIREBASE_PROJECT_ID'],
            'FIREBASE_STORAGE_BUCKET_PLACEHOLDER': os.environ['FIREBASE_STORAGE_BUCKET'],
            'FIREBASE_SENDER_ID_PLACEHOLDER': os.environ['FIREBASE_MESSAGING_SENDER_ID'],
            'FIREBASE_APP_ID_PLACEHOLDER': os.environ['FIREBASE_APP_ID'],
            'FIREBASE_MEASUREMENT_ID_PLACEHOLDER': os.environ['FIREBASE_MEASUREMENT_ID'],
            'BACKEND_URL_PLACEHOLDER': os.environ['_BACKEND_URL'] + '/api',
            'GOOGLE_CLIENT_ID_PLACEHOLDER': os.environ['GOOGLE_CLIENT_ID'],
        }

        firebase_replacements = {
            'SITE_ID_PLACEHOLDER': os.environ['_FIREBASE_SITE_ID'],
            'BACKEND_SERVICE_ID_PLACEHOLDER': os.environ['_BACKEND_SERVICE_ID'],
        }

        inject('src/environments/environment.prod.ts', env_replacements)
        inject('firebase.json', firebase_replacements)
        print('Injection complete')
    dir: frontend
    env:
      - '_BACKEND_URL=${_BACKEND_URL}'
      - '_FE_SERVICE_NAME=${_FE_SERVICE_NAME}'
      - '_BACKEND_SERVICE_ID=${_BACKEND_SERVICE_ID}'
      - '_FIREBASE_SITE_ID=${_FIREBASE_SITE_ID}'
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_APP_ID
      - FIREBASE_MEASUREMENT_ID
      - GOOGLE_CLIENT_ID

  - name: 'node:20-alpine'
    id: 'Build Angular App'
    entrypoint: 'npm'
    args: ['run', 'build', '--', '--configuration=production']
    env:
      - 'NODE_OPTIONS=--max_old_space_size=4096'
    waitFor: ['Inject Environment Variables']
    dir: frontend

  - name: 'node:20-alpine'
    id: 'Deploy to Firebase Hosting'
    entrypoint: 'npx'
    args:
      - 'firebase'
      - 'deploy'
      - '--project=${PROJECT_ID}'
      - '--only=hosting:${_FIREBASE_SITE_ID}'
      - '--non-interactive'
    waitFor: ['Build Angular App']
    dir: frontend
    env:
      - '_FIREBASE_SITE_ID=${_FIREBASE_SITE_ID}'

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_CLIENT_ID/versions/latest
      env: 'GOOGLE_CLIENT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_API_KEY/versions/latest
      env: 'FIREBASE_API_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
      env: 'FIREBASE_AUTH_DOMAIN'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: 'FIREBASE_PROJECT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
      env: 'FIREBASE_STORAGE_BUCKET'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: 'FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_APP_ID/versions/latest
      env: 'FIREBASE_APP_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_MEASUREMENT_ID/versions/latest
      env: 'FIREBASE_MEASUREMENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
